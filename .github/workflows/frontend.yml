name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

defaults:
  run:
    working-directory: frontend

jobs:
  ci:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Auth.js requires a secret at build time; use a dummy value for CI
          AUTH_SECRET: ci-dummy-secret-not-used-at-runtime
          AUTH_GOOGLE_ID: ci-dummy-client-id
          AUTH_GOOGLE_SECRET: ci-dummy-client-secret
          API_URL: http://localhost:8080
          AUTH_URL: http://localhost:3000
